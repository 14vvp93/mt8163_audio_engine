name: Reassemble and inspect HEQ archive

on:
  workflow_dispatch:
  push:
    paths:
      - "HEQ/HEQ.zip.*"
      - ".github/workflows/reassemble-heq.yml"

permissions:
  contents: read

jobs:
  reassemble:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify all archive volumes are present
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(HEQ/HEQ.zip.[0-9][0-9][0-9])
          if (( ${#parts[@]} != 17 )); then
            printf 'Expected 17 volumes, found %s\n' "${#parts[@]}"
            printf '%s\n' "${parts[@]}"
            exit 1
          fi
          for i in $(seq -w 1 17); do
            file="HEQ/HEQ.zip.$i"
            test -s "$file" || { echo "Missing or empty: $file"; exit 1; }
          done
          echo "All 17 volumes found."
          du -h HEQ/HEQ.zip.*

      - name: Reassemble split ZIP
        shell: bash
        run: |
          set -euo pipefail
          cat HEQ/HEQ.zip.{001..017} > HEQ.zip
          echo "Reassembled size: $(stat -c '%s' HEQ.zip) bytes"
          sha256sum HEQ.zip | tee HEQ.zip.sha256
          file HEQ.zip

      - name: Test and extract archive
        shell: bash
        run: |
          set -euo pipefail
          unzip -t HEQ.zip
          mkdir extracted
          unzip -q HEQ.zip -d extracted
          find extracted -type f -printf '%P\t%s bytes\n' | sort | tee HEQ_CONTENTS.txt
          echo
          echo "Files: $(find extracted -type f | wc -l)"
          echo "Directories: $(find extracted -type d | wc -l)"

      - name: Upload reconstructed archive and extracted contents
        uses: actions/upload-artifact@v4
        with:
          name: heq-reassembled-and-extracted
          path: |
            HEQ.zip
            HEQ.zip.sha256
            HEQ_CONTENTS.txt
            extracted/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
