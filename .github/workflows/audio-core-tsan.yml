name: AudioCore ThreadSanitizer

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audio-core-tsan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audio-core-tsan:
    name: audio-core-tsan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure full AudioCore ThreadSanitizer build
        run: |
          cmake -S pcm-dsp -B build-tsan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DPCM_DSP_BUILD_TESTS=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"

      - name: Build all AudioCore tests
        run: cmake --build build-tsan --parallel 2

      - name: Run complete AudioCore test suite under TSAN
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: ctest --test-dir build-tsan --output-on-failure
