name: Primary HAL P2 Private Callback Automation

on:
  push:
    branches: [feature]
    paths:
      - "primary-hal/**"
      - "docs/ANDROID9_ARM32_PRIMARY_HAL_ABI_BASELINE.md"
      - "docs/P2_PRIVATE_HAL_CALLBACK_EVIDENCE_MATRIX.md"
      - "docs/P2_VENDOR_SOURCE_CORROBORATION.md"
      - "docs/PROJECT_ROADMAP.md"
      - "scripts/repository/check_primary_hal_fail_closed.py"
      - "scripts/repository/check_primary_hal_p2_contract.py"
      - "scripts/repository/scan_primary_hal_p2_clients.py"
      - "scripts/repository/audit_primary_hal_voiceunlock_lifecycle.py"
      - "scripts/repository/audit_primary_hal_p2_client.py"
      - "scripts/repository/audit_primary_hal_p2_atci.py"
      - "scripts/repository/audit_primary_hal_p2_hidl_callback.py"
      - "scripts/repository/audit_primary_hal_p2_hidl_bridge.py"
      - "scripts/repository/audit_primary_hal_p2_hidl_device_lifetime.py"
      - ".github/workflows/primary-hal-p2-private-callbacks.yml"
  pull_request:
    branches: [feature]
    paths:
      - "primary-hal/**"
      - "docs/ANDROID9_ARM32_PRIMARY_HAL_ABI_BASELINE.md"
      - "docs/P2_PRIVATE_HAL_CALLBACK_EVIDENCE_MATRIX.md"
      - "docs/P2_VENDOR_SOURCE_CORROBORATION.md"
      - "docs/PROJECT_ROADMAP.md"
      - "scripts/repository/check_primary_hal_fail_closed.py"
      - "scripts/repository/check_primary_hal_p2_contract.py"
      - "scripts/repository/scan_primary_hal_p2_clients.py"
      - "scripts/repository/audit_primary_hal_voiceunlock_lifecycle.py"
      - "scripts/repository/audit_primary_hal_p2_client.py"
      - "scripts/repository/audit_primary_hal_p2_atci.py"
      - "scripts/repository/audit_primary_hal_p2_hidl_callback.py"
      - "scripts/repository/audit_primary_hal_p2_hidl_bridge.py"
      - ".github/workflows/primary-hal-p2-private-callbacks.yml"
  workflow_dispatch:

permissions:
  contents: read

# Each audit run is read-only and has isolated artifacts; use a unique group
# so GitHub does not replace an older pending run with a newer request.
concurrency:
  group: primary-hal-p2-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  contract-gates:
    name: P2 contract inventory and fail-closed gates
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout feature
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require feature branch for manual execution
        if: github.event_name == 'workflow_dispatch'
        run: |
          test "${GITHUB_REF}" = "refs/heads/feature" || {
            echo "::error::P2 automation must run against feature."
            exit 1
          }
      - name: Verify Primary HAL remains fail-closed
        run: python3 scripts/repository/check_primary_hal_fail_closed.py
      - name: Verify all 16 private callback slots and open evidence gaps
        run: python3 scripts/repository/check_primary_hal_p2_contract.py
      - name: Validate Python and Markdown
        run: |
          python3 -m py_compile \
            scripts/repository/check_primary_hal_fail_closed.py \
            scripts/repository/check_primary_hal_p2_contract.py \
            scripts/repository/scan_primary_hal_p2_clients.py \
            scripts/repository/audit_primary_hal_voiceunlock_lifecycle.py \
            scripts/repository/audit_primary_hal_p2_client.py \
            scripts/repository/audit_primary_hal_p2_atci.py \
            scripts/repository/audit_primary_hal_p2_hidl_callback.py \
            scripts/repository/audit_primary_hal_p2_hidl_bridge.py \
            scripts/repository/audit_primary_hal_p2_hidl_device_lifetime.py
          python3 scripts/repository/check_markdown_links.py
      - name: Validate workflow YAML
        run: ruby -e 'require "yaml"; y = YAML.load_file(".github/workflows/primary-hal-p2-private-callbacks.yml"); abort("invalid workflow") unless y.is_a?(Hash) && y["jobs"].is_a?(Hash); puts "P2 workflow YAML OK"'

  factory-binary-evidence:
    name: Reproducible factory binary and external-client scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout feature audit tools
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: |
            tools/audit_primary_hal_binary.sh
            tools/audit_android_packed_relocations.py
            scripts/repository/scan_primary_hal_p2_clients.py
            scripts/repository/audit_primary_hal_voiceunlock_lifecycle.py
            scripts/repository/audit_primary_hal_p2_client.py
            scripts/repository/audit_primary_hal_p2_atci.py
            scripts/repository/audit_primary_hal_p2_hidl_callback.py
            scripts/repository/audit_primary_hal_p2_hidl_bridge.py
            scripts/repository/audit_primary_hal_p2_hidl_device_lifetime.py
          sparse-checkout-cone-mode: false
      - name: Checkout immutable public firmware dataset
        uses: actions/checkout@v5
        with:
          repository: 14vvp93/public_calculations
          ref: 865b6efaeff0c4547dab1f4456f2fa664b3611d1
          path: factory-firmware
          sparse-checkout: |
            firmware/extracted/system/bin
            firmware/extracted/system/lib
            firmware/extracted/vendor/bin
            firmware/extracted/vendor/lib
            firmware/extracted/system/framework
            firmware/extracted/system/AudioInputSource
            firmware/extracted/system/audioserver
            firmware/extracted/vendor/android.hardware.audio@4.0-service-mediatek
            firmware/extracted/vendor/audiocmdservice_atci
          sparse-checkout-cone-mode: false
      - name: Install ARM32 binutils
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils-arm-linux-gnueabi
      - name: Verify factory HAL identity and ELF contract
        shell: bash
        run: |
          set -euo pipefail
          binary="factory-firmware/firmware/extracted/vendor/lib/hw/audio.primary.mt8163.so"
          test -s "$binary"
          test "$(wc -c < "$binary" | tr -d ' ')" = "1671852"
          echo "Expected SHA-256: 112744a4dad30d809d638d8aecd75ddba1ed7bbfcda8c4d2f9fde4463d8bfde4"
          actual="$(sha256sum "$binary" | awk '{print $1}')"
          test "$actual" = "112744a4dad30d809d638d8aecd75ddba1ed7bbfcda8c4d2f9fde4463d8bfde4"
          sh tools/audit_primary_hal_binary.sh "$binary" | tee p2-factory-elf-audit.txt
          python3 tools/audit_android_packed_relocations.py "$binary" | tee p2-factory-relocations.txt
          python3 tools/audit_android_packed_relocations.py "$binary" --symbol _ZTVN7android18AudioALSAStreamOutE
          python3 tools/audit_android_packed_relocations.py "$binary" --symbol _ZTVN7android17AudioALSAStreamInE
      - name: Scan ELF, Android runtime bytecode, and APK/JAR clients
        shell: bash
        run: |
          set -euo pipefail
          binary="factory-firmware/firmware/extracted/vendor/lib/hw/audio.primary.mt8163.so"
          test -s "$binary"
          echo "Public firmware dataset commit: 865b6efaeff0c4547dab1f4456f2fa664b3611d1"
          python3 scripts/repository/scan_primary_hal_p2_clients.py factory-firmware/firmware/extracted | tee p2-private-callback-client-scan.txt
          python3 scripts/repository/audit_primary_hal_voiceunlock_lifecycle.py "$binary" | tee p2-voiceunlock-lifecycle-disassembly.txt
          client="factory-firmware/firmware/extracted/vendor/lib/libaudioprimarydevicehalifclient.so"
          test -s "$client"
          python3 scripts/repository/audit_primary_hal_p2_client.py "$client" | tee p2-hal-client-disassembly.txt
          atci="factory-firmware/firmware/extracted/vendor/audiocmdservice_atci"
          test -s "$atci"
          python3 scripts/repository/audit_primary_hal_p2_atci.py "$atci" | tee p2-atci-client-callers.txt
          hidl="factory-firmware/firmware/extracted/vendor/lib/vendor.mediatek.hardware.audio@4.1.so"
          test -s "$hidl"
          python3 scripts/repository/audit_primary_hal_p2_hidl_callback.py "$hidl" | tee p2-hidl-callback-transaction.txt
          bridge="factory-firmware/firmware/extracted/vendor/lib/hw/android.hardware.audio@4.0-impl-mediatek.so"
          test -s "$bridge"
          python3 scripts/repository/audit_primary_hal_p2_hidl_bridge.py "$bridge" | tee p2-hidl-bridge-lifecycle.txt
          python3 scripts/repository/audit_primary_hal_p2_hidl_device_lifetime.py "$bridge" | tee p2-hidl-device-lifetime.txt
      - name: Preserve reproducible P2 evidence
        uses: actions/upload-artifact@v6
        with:
          name: mt8163-primary-hal-p2-evidence
          path: |
            p2-factory-elf-audit.txt
            p2-factory-relocations.txt
            p2-private-callback-client-scan.txt
            p2-voiceunlock-lifecycle-disassembly.txt
            p2-hal-client-disassembly.txt
            p2-atci-client-callers.txt
            p2-hidl-callback-transaction.txt
            p2-hidl-bridge-lifecycle.txt
            p2-hidl-device-lifetime.txt
          if-no-files-found: error
          retention-days: 30

  p2-complete:
    name: P2 OFFLINE EVIDENCE PIPELINE COMPLETE
    if: always()
    needs:
      - contract-gates
      - factory-binary-evidence
    runs-on: ubuntu-24.04
    steps:
      - name: Require every offline evidence job
        env:
          CONTRACTS: ${{ needs.contract-gates.result }}
          FACTORY: ${{ needs.factory-binary-evidence.result }}
        run: |
          set -euo pipefail
          printf 'CONTRACTS=%s FACTORY=%s\n' "$CONTRACTS" "$FACTORY"
          test "$CONTRACTS" = success
          test "$FACTORY" = success
          echo "P2 OFFLINE EVIDENCE PIPELINE COMPLETE."
          echo "This does not close P2 or authorize enabling stream callbacks."
