name: CD3313 Protocol Safety

on:
  push:
    branches:
      - integration/beta-0.1
    paths:
      - "cd3313-emulator/**"
      - ".github/workflows/cd3313-protocol-safety.yml"
  pull_request:
    branches:
      - integration/beta-0.1
    paths:
      - "cd3313-emulator/**"
      - ".github/workflows/cd3313-protocol-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-tests:
    name: protocol-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure
        run: cmake -S cd3313-emulator -B build/cd3313 -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build/cd3313 --parallel 2

      - name: Run protocol tests
        run: ctest --test-dir build/cd3313 --output-on-failure

  protocol-asan-ubsan:
    name: protocol-asan-ubsan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure with AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          cmake -S cd3313-emulator -B build/cd3313-sanitized \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build/cd3313-sanitized --parallel 2

      - name: Run sanitized protocol tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build/cd3313-sanitized --output-on-failure

  protocol-libfuzzer:
    name: protocol-libfuzzer
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Clang libFuzzer target
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S cd3313-emulator -B build/cd3313-fuzz \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCD3313_BUILD_FUZZER=ON

      - name: Build fuzzer
        run: cmake --build build/cd3313-fuzz --target cd3313_protocol_fuzzer --parallel 2

      - name: Fuzz parser and encoder
        run: |
          mkdir -p build/cd3313-corpus
          build/cd3313-fuzz/cd3313_protocol_fuzzer \
            build/cd3313-corpus \
            -max_total_time=45 \
            -timeout=5 \
            -rss_limit_mb=2048
