name: Build MT8163 Audio Test APK

on:
  workflow_dispatch:

permissions:
  contents: read


jobs:
  build-test-apk:
    # Pin the runner to avoid unexpected ubuntu-latest image migrations.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Reuse preinstalled Android SDK components
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_NDK_VERSION: 27.3.13750724
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          packages=()
          [ -d "$ANDROID_HOME/platforms/android-35" ] || packages+=("platforms;android-35")
          [ -d "$ANDROID_HOME/build-tools/35.0.0" ] || packages+=("build-tools;35.0.0")
          [ -d "$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" ] || packages+=("ndk;$ANDROID_NDK_VERSION")
          [ -d "$ANDROID_HOME/cmake/3.31.5" ] || packages+=("cmake;3.31.5")
          if [ "${#packages[@]}" -gt 0 ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null
            "$SDKMANAGER" --install "${packages[@]}"
          fi
          test -x "$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: android-test
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload test APK
        uses: actions/upload-artifact@v6
        with:
          name: mt8163-audio-test-debug-apk
          path: android-test/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
