name: Build MT8163 Audio Test APK

on:
  push:
    paths:
      - "android-test/**"
      - "pcm-dsp/**"
      - ".github/workflows/build-android-test-apk.yml"
  pull_request:
    paths:
      - "android-test/**"
      - "pcm-dsp/**"
      - ".github/workflows/build-android-test-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-apk:
    # Pin the runner to avoid unexpected ubuntu-latest image migrations.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: android-test
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload test APK
        uses: actions/upload-artifact@v6
        with:
          name: mt8163-audio-test-debug-apk
          path: android-test/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
