name: Analyze Carservices VDEX

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/analyze-carservices-vdex.yml"

permissions:
  contents: read
  actions: read

jobs:
  analyze-carservices-vdex:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install build dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential zlib1g-dev

      - name: Build pinned VDEX extractor
        run: |
          set -euo pipefail
          git clone https://github.com/anestisb/vdexExtractor.git /tmp/vdexExtractor
          git -C /tmp/vdexExtractor checkout 78f283b60ab6991fa27eeaff7d7be16409401c08
          cd /tmp/vdexExtractor
          ./make.sh gcc
          test -x bin/vdexExtractor
          bin/vdexExtractor --get-api -i /dev/null || true

      - name: Download firmware analysis artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/firmware-artifact
          gh run download 43089987118 \
            --repo "${GITHUB_REPOSITORY}" \
            --name firmware-library-analysis \
            --dir /tmp/firmware-artifact
          VDEX="$(find /tmp/firmware-artifact -type f -name boot-carservices.vdex -print -quit)"
          test -n "$VDEX"
          cp "$VDEX" /tmp/boot-carservices.vdex
          file /tmp/boot-carservices.vdex
          sha256sum /tmp/boot-carservices.vdex

      - name: Extract and disassemble CompactDex
        run: |
          set -euo pipefail
          mkdir -p /tmp/carservices-vdex
          /tmp/vdexExtractor/bin/vdexExtractor \
            -i /tmp/boot-carservices.vdex \
            -o /tmp/carservices-vdex \
            --dis -f \
            -l /tmp/carservices-vdex/disassembly.log
          test -s /tmp/carservices-vdex/disassembly.log
          grep -n -E 'McuService|sendCmdCarStatus|sendAccState|sendReverseState|sendCmdAudioMux|doExtAudioEffect|mute=' \
            /tmp/carservices-vdex/disassembly.log > /tmp/carservices-vdex/targeted-hits.txt || true
          cat /tmp/carservices-vdex/targeted-hits.txt

      - name: Upload VDEX analysis
        uses: actions/upload-artifact@v4
        with:
          name: carservices-vdex-analysis
          path: |
            /tmp/boot-carservices.vdex
            /tmp/carservices-vdex/disassembly.log
            /tmp/carservices-vdex/targeted-hits.txt
          if-no-files-found: error
          retention-days: 14
