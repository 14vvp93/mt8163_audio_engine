name: Reassemble and analyze firmware library archives

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/analyze-firmware-libraries.yml"
      - "reference-materials/firmware-dumps/files.zip"
      - "reference-materials/firmware-dumps/files2.zip.*"
      - "reference-materials/firmware-dumps/lib.zip.*"
      - "reference-materials/firmware-dumps/vendor_lib.zip.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reassemble-and-analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Reassemble split archives and extract safely
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import re

          root = Path("reference-materials/firmware-dumps")
          out = Path("firmware-analysis")
          out.mkdir(exist_ok=True)
          archives = []

          if (root / "files.zip").is_file():
              archives.append(("files", [root / "files.zip"]))

          for first in sorted(root.glob("*.zip.001")):
              stem = first.name[:-4]  # remove .001
              parts = sorted(root.glob(stem + ".*"))
              expected = [root / f"{stem}.{i:03d}" for i in range(1, len(parts) + 1)]
              if parts != expected:
                  raise SystemExit(f"Missing or unexpected split part for {stem}: {parts}")
              archives.append((stem[:-4], parts))

          if not archives:
              raise SystemExit("No supported ZIP archives found")

          inventory = []
          for name, parts in archives:
              joined = out / f"{name}.zip"
              with joined.open("wb") as dst:
                  for part in parts:
                      print(f"Appending {part} ({part.stat().st_size} bytes)")
                      with part.open("rb") as src:
                          while chunk := src.read(1024 * 1024):
                              dst.write(chunk)

              target = (out / name).resolve()
              target.mkdir(parents=True, exist_ok=True)
              with ZipFile(joined) as zf:
                  bad = zf.testzip()
                  if bad:
                      raise SystemExit(f"Corrupt member in {joined}: {bad}")
                  for item in zf.infolist():
                      dest = (target / item.filename).resolve()
                      if dest != target and target not in dest.parents:
                          raise SystemExit(f"Unsafe archive path in {joined}: {item.filename}")
                      if item.is_dir():
                          dest.mkdir(parents=True, exist_ok=True)
                      else:
                          dest.parent.mkdir(parents=True, exist_ok=True)
                          with zf.open(item) as src, dest.open("wb") as dst:
                              while chunk := src.read(1024 * 1024):
                                  dst.write(chunk)
              count = sum(1 for p in target.rglob("*") if p.is_file())
              inventory.append((name, len(parts), joined.stat().st_size, count))
              print(f"EXTRACTED {name}: {count} files")

          with (out / "ARCHIVE_INVENTORY.txt").open("w") as f:
              for name, count, size, extracted in inventory:
                  f.write(f"{name}: {count} source part(s), {size} bytes joined, {extracted} extracted files\\n")
          PY

      - name: Build pinned VDEX extractor
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential zlib1g-dev binutils-arm-linux-gnueabi device-tree-compiler
          git clone https://github.com/anestisb/vdexExtractor.git /tmp/vdexExtractor
          git -C /tmp/vdexExtractor checkout 78f283b60ab6991fa27eeaff7d7be16409401c08
          sed -i 's/-Wall -Wextra -Werror/-Wall -Wextra -Werror -Wno-error=vla-parameter/' /tmp/vdexExtractor/src/Makefile
          cd /tmp/vdexExtractor
          ./make.sh gcc
          test -x bin/vdexExtractor

      - name: Disassemble carservices CompactDex
        shell: bash
        run: |
          set -euo pipefail
          VDEX="$(find firmware-analysis -type f -name boot-carservices.vdex -print -quit)"
          test -n "$VDEX"
          mkdir -p firmware-analysis/carservices-vdex
          cp "$VDEX" firmware-analysis/carservices-vdex/boot-carservices.vdex
          file "$VDEX" | tee firmware-analysis/carservices-vdex/file-info.txt
          sha256sum "$VDEX" | tee firmware-analysis/carservices-vdex/sha256.txt
          /tmp/vdexExtractor/bin/vdexExtractor --get-api -i "$VDEX" | tee firmware-analysis/carservices-vdex/api-version.txt
          /tmp/vdexExtractor/bin/vdexExtractor \
            -i "$VDEX" \
            -o firmware-analysis/carservices-vdex \
            --dis -f \
            -l firmware-analysis/carservices-vdex/disassembly.log
          test -s firmware-analysis/carservices-vdex/disassembly.log
          grep -n -E 'McuService|sendCmdCarStatus|sendAccState|sendReverseState|sendCmdAudioMux|doExtAudioEffect|mute=' \
            firmware-analysis/carservices-vdex/disassembly.log \
            > firmware-analysis/carservices-vdex/targeted-hits.txt || true
          cat firmware-analysis/carservices-vdex/targeted-hits.txt

      - name: Inventory native libraries and search CD3313 audio symbols
        shell: bash
        run: |
          set -euo pipefail
          report="firmware-analysis/NATIVE_AUDIO_SCAN.txt"
          : > "$report"
          echo "Firmware native-library scan" >> "$report"
          echo "Generated: $(date -u +%FT%TZ)" >> "$report"
          echo >> "$report"
          find firmware-analysis -type f \( -name '*.so' -o -name '*.so.*' -o -name '*.ko' \) -print0 |
          while IFS= read -r -d '' f; do
            {
              echo "===== $f ====="
              file "$f" || true
              strings -a "$f" 2>/dev/null |
                grep -Ei 'audiomux|ExtAudioMuxer|SendCmdAudioMux|cd3313|carstatus|AudioEffect|ISourceService|SourceService|doExtAudioEffect|DLCustAudio|AudioCmdHandler|HFP|AudioTasteRunning' |
                sort -u | head -n 300 || true
              if file "$f" | grep -q ELF; then
                readelf -Ws "$f" 2>/dev/null |
                  grep -Ei 'audiomux|ExtAudioMuxer|SendCmdAudioMux|cd3313|AudioEffect|SourceService' |
                  head -n 100 || true
              fi
              echo
            } >> "$report"
          done
          echo "Scanned $(find firmware-analysis -type f \( -name '*.so' -o -name '*.so.*' -o -name '*.ko' \) | wc -l) native objects" >> "$report"
          cat "$report"

      - name: Produce a compact report for the paired CD3313 module
        shell: bash
        run: |
          set -euo pipefail
          MODULE="$(find firmware-analysis -type f -path '*/vendor_lib/lib/modules/cd3313.ko' -print -quit)"
          test -n "$MODULE"
          OUT=firmware-analysis/cd3313-current
          mkdir -p "$OUT"
          cp "$MODULE" "$OUT/cd3313.ko"
          file "$OUT/cd3313.ko" | tee "$OUT/file-info.txt"
          sha256sum "$OUT/cd3313.ko" | tee "$OUT/sha256.txt"
          arm-linux-gnueabi-readelf -h -n -Ws "$OUT/cd3313.ko" > "$OUT/elf-symbols.txt"
          arm-linux-gnueabi-objdump -drwC "$OUT/cd3313.ko" > "$OUT/disassembly.txt"
          strings -a -t x "$OUT/cd3313.ko" > "$OUT/strings.txt"
          grep -Ein 'channel_to_cd3313|RADIO|AUX|EXBT|DAB|set_input_channel|set_input_mute|set_master_mute|channel_mute|master_mute|gpio' \
            "$OUT/elf-symbols.txt" "$OUT/disassembly.txt" "$OUT/strings.txt" > "$OUT/focused-hits.txt" || true
          test -s "$OUT/disassembly.txt"
          test -s "$OUT/focused-hits.txt"

      - name: Upload compact CD3313 module analysis
        uses: actions/upload-artifact@v6
        with:
          name: cd3313-current-module-analysis
          path: firmware-analysis/cd3313-current/
          if-no-files-found: error
          retention-days: 14

      - name: Extract focused board audio routing evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT=firmware-analysis/board-audio-routing
          mkdir -p "$OUT/decompiled-dtb"
          find firmware-analysis -type f \
            \( -iname '*.dts' -o -iname '*.dtsi' -o -iname '*.dtb' -o -iname '*.dtbo' \
               -o -iname '*.xml' -o -iname '*.conf' -o -iname '*.ini' -o -iname '*.cfg' \
               -o -iname '*.rc' -o -iname '*.prop' -o -iname '*.mk' \) \
            ! -path '*/board-audio-routing/*' -print | sort > "$OUT/candidate-files.txt"

          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess

          root = Path("firmware-analysis")
          out = Path("firmware-analysis/board-audio-routing")
          text_ext = {".dts", ".dtsi", ".xml", ".conf", ".ini", ".cfg", ".rc", ".prop", ".mk"}
          rx = re.compile(
              r"FM_I2S_Playback|FM_I2S_Capture|MRGRX_PLayback|MRGRX_CAPTURE|"
              r"FM_TUNER|AUDIO_DEVICE_IN_FM_TUNER|GPIO_Radio_DAB_SW|"
              r"GPIO39_Aux_Aux2_SW|aud_path|i2s_pad|FM_I2S|"
              r"GPIO.{0,32}(FM|Radio|DAB)|(?:FM|Radio|DAB).{0,32}GPIO|"
              r"(?:FM|Radio).{0,32}I2S|I2S.{0,32}(?:FM|Radio)",
              re.IGNORECASE,
          )
          match_path = out / "text-matches.txt"
          scanned = 0
          matches = 0
          with match_path.open("w", errors="replace") as report:
              for path in root.rglob("*"):
                  if not path.is_file() or path.suffix.lower() not in text_ext:
                      continue
                  try:
                      if path.stat().st_size > 8 * 1024 * 1024:
                          continue
                      raw = path.read_bytes()
                      if b"\x00" in raw[:4096]:
                          continue
                      content = raw.decode("utf-8", errors="replace")
                  except OSError:
                      continue
                  scanned += 1
                  for number, line in enumerate(content.splitlines(), 1):
                      if rx.search(line):
                          report.write(f"{path}:{number}:{line[:1000]}\n")
                          matches += 1

          dtb_index = 0
          with (out / "dtb-conversion.txt").open("w") as log:
              for path in root.rglob("*"):
                  if not path.is_file() or path.suffix.lower() not in {".dtb", ".dtbo"}:
                      continue
                  dtb_index += 1
                  target = out / "decompiled-dtb" / f"{dtb_index:04d}-{path.stem}.dts"
                  result = subprocess.run(
                      ["dtc", "-I", "dtb", "-O", "dts", "-o", str(target), str(path)],
                      text=True, capture_output=True,
                  )
                  log.write(f"{path} -> {target}: exit={result.returncode}\n")
                  if result.stderr:
                      log.write(result.stderr[:4000] + "\n")
                  if result.returncode != 0 and target.exists():
                      target.unlink()
          print(f"Scanned {scanned} text configuration files; found {matches} matching lines; attempted {dtb_index} DTB/DTBO conversions")
          PY

          find firmware-analysis -type f \
            \( -iname '*.ko' -o -iname '*.dtb' -o -iname '*.dtbo' -o -iname '*audio*policy*' \
               -o -iname '*audio*platform*' -o -iname '*audio*config*' \) \
            ! -path '*/board-audio-routing/*' -print | sort > "$OUT/audio-and-device-tree-binaries.txt"
          test -s "$OUT/candidate-files.txt"
          test -f "$OUT/text-matches.txt"
          echo "Candidate files: $(wc -l < "$OUT/candidate-files.txt")"
          echo "Matched lines: $(wc -l < "$OUT/text-matches.txt")"
          echo "Decompiled DTBs: $(find "$OUT/decompiled-dtb" -type f -name '*.dts' | wc -l)"

      - name: Collect AudioALSADeviceParser and policy configuration
        shell: bash
        run: |
          set -euo pipefail
          OUT=firmware-analysis/board-audio-routing
          mkdir -p "$OUT/config-files"
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil

          root = Path("firmware-analysis")
          out = Path("firmware-analysis/board-audio-routing/config-files")
          wanted = {
              "audio_device.xml", "audio_em.xml", "audio_policy_configuration.xml",
              "audio_policy.conf", "audio_effects.xml", "AudioParamOptions.xml",
              "audio_param_options.xml",
          }
          found = []
          for path in root.rglob("*"):
              if not path.is_file() or path.name not in wanted:
                  continue
              if "board-audio-routing" in path.parts:
                  continue
              rel = path.relative_to(root)
              target = out / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(path, target)
              found.append((str(rel), target.stat().st_size))
          with (out.parent / "selected-config-files.txt").open("w") as f:
              for name, size in found:
                  f.write(f"{name} ({size} bytes)\n")
          print(f"Copied {len(found)} targeted audio/policy configuration files")
          PY
          find firmware-analysis -type f \
            \( -iname 'boot*.img' -o -iname 'dtbo*' -o -iname '*dtb*' -o -iname '*.img' \
               -o -iname 'lk.bin' -o -iname 'preloader*' \) \
            ! -path '*/board-audio-routing/*' -print | sort > "$OUT/boot-and-dtb-image-candidates.txt"
          grep -RInI -E 'FM_I2S|MRGRX|FM_TUNER|tuner|radio|PCM|CARD|card|pcm|AudioALSADeviceParser|FM_DIRECT_CONTROL' \
            "$OUT/config-files" > "$OUT/config-search.txt" || true
          echo "Selected config files: $(wc -l < "$OUT/selected-config-files.txt")"
          echo "Boot/DTB image candidates: $(wc -l < "$OUT/boot-and-dtb-image-candidates.txt")"
          echo "Config matches: $(wc -l < "$OUT/config-search.txt")"

      - name: Analyze FM tuner kernel modules
        shell: bash
        run: |
          set -euo pipefail
          SRC=firmware-analysis/vendor_lib/lib/modules
          OUT=firmware-analysis/fm-tuner-drivers
          mkdir -p "$OUT"
          for module in fmradio_drv qn8027 qn8035 si475x tda7708LX wmt_drv; do
            input="$SRC/$module.ko"
            if [ ! -f "$input" ]; then
              echo "MISSING $input" >> "$OUT/module-inventory.txt"
              continue
            fi
            mkdir -p "$OUT/$module"
            cp "$input" "$OUT/$module/$module.ko"
            (
              cd "$OUT/$module"
              sha256sum "$module.ko" > sha256.txt
              file "$module.ko" > file.txt
              readelf -h -n -Ws -rW "$module.ko" > elf-report.txt 2>&1 || true
              arm-linux-gnueabi-objdump -drwC "$module.ko" > disassembly.txt 2>&1 || true
              strings -a -t x "$module.ko" > strings.txt
              grep -i -E 'fm|radio|tuner|i2s|ioctl|audio_info|aud_path|pad|gpio|wmt|chip|i2c|/dev/' strings.txt > focused-strings.txt || true
            )
            echo "FOUND $input" >> "$OUT/module-inventory.txt"
          done
          test -s "$OUT/module-inventory.txt"
          find "$OUT" -maxdepth 2 -type f -printf '%p %s bytes\n' | sort > "$OUT/file-inventory.txt"
          echo "Analyzed modules:"
          cat "$OUT/module-inventory.txt"

      - name: Upload FM tuner driver analysis
        uses: actions/upload-artifact@v6
        with:
          name: mt8163-fm-tuner-driver-analysis
          path: firmware-analysis/fm-tuner-drivers/
          if-no-files-found: error
          retention-days: 14

      - name: Upload focused board audio routing evidence
        uses: actions/upload-artifact@v6
        with:
          name: mt8163-board-audio-routing-evidence
          path: firmware-analysis/board-audio-routing/
          if-no-files-found: error
          retention-days: 14

      - name: Upload reassembled archives, extracted files and reports
        uses: actions/upload-artifact@v6
        with:
          name: firmware-library-analysis
          path: firmware-analysis/
          if-no-files-found: error
          retention-days: 14

