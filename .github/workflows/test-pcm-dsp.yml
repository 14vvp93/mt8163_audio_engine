name: Test PCM DSP core

on:
  push:
    branches: [main, feature]
    paths:
      - "pcm-dsp/**"
      - "audio-core/**"
  pull_request:
    branches: [main, feature]
    paths:
      - "pcm-dsp/**"
      - "audio-core/**"
  workflow_dispatch:

concurrency:
  group: test-pcm-dsp-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S pcm-dsp -B build/pcm-dsp -DPCM_DSP_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build/pcm-dsp --parallel
      - name: Test
        run: ctest --test-dir build/pcm-dsp --output-on-failure
