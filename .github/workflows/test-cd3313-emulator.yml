name: Test CD3313 protocol emulator

on:
  push:
    branches: [main]
    paths:
      - "cd3313-emulator/**"
      - ".github/workflows/test-cd3313-emulator.yml"
  pull_request:
    paths:
      - "cd3313-emulator/**"
      - ".github/workflows/test-cd3313-emulator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S cd3313-emulator -B build/cd3313 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/cd3313 --parallel 2
      - name: Test
        run: ctest --test-dir build/cd3313 --output-on-failure
