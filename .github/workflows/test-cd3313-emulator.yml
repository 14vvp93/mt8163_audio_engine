name: Test CD3313 protocol emulator

# Covers the ioctl model and the /dev/audiomux character-device read/write model.

on:
  push:
    branches: [main]
    paths:
      - "cd3313-emulator/**"
      - ".github/workflows/test-cd3313-emulator.yml"
  pull_request:
    paths:
      - "cd3313-emulator/**"
      - ".github/workflows/test-cd3313-emulator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S cd3313-emulator -B build/cd3313 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/cd3313 --parallel 2
      - name: Test
        run: ctest --test-dir build/cd3313 --output-on-failure

  sanitizer-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Configure with AddressSanitizer and UndefinedBehaviorSanitizer
        run: >-
          cmake -S cd3313-emulator -B build/cd3313-sanitized
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build/cd3313-sanitized --parallel 2
      - name: Test
        run: ctest --test-dir build/cd3313-sanitized --output-on-failure
