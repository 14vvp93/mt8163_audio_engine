name: Analyze MT8163 audio HAL

on:
  push:
    branches: [main]
    paths:
      - "reference-materials/firmware-dumps/files.zip"
      - ".github/workflows/analyze-audio-hal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install ARM analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils binutils-arm-linux-gnueabi binutils-multiarch file unzip python3

      - name: Extract and identify HAL files
        run: |
          test -s reference-materials/firmware-dumps/files.zip
          mkdir -p audio-hal-analysis/input audio-hal-analysis/reports
          unzip -oq reference-materials/firmware-dumps/files.zip -d audio-hal-analysis/input
          find audio-hal-analysis/input -type f -print0 | sort -z | xargs -0 file > audio-hal-analysis/reports/file-types.txt
          sha256sum audio-hal-analysis/input/files/vendor/audio.primary.mt8163.so > audio-hal-analysis/reports/audio-primary-sha256.txt

      - name: Analyze primary HAL symbols and relocations
        run: |
          SO=audio-hal-analysis/input/files/vendor/audio.primary.mt8163.so
          arm-linux-gnueabi-readelf -h "$SO" > audio-hal-analysis/reports/primary-elf-header.txt
          arm-linux-gnueabi-readelf -Ws "$SO" | c++filt > audio-hal-analysis/reports/primary-symbols-demangled.txt
          arm-linux-gnueabi-readelf -rW "$SO" > audio-hal-analysis/reports/primary-relocations.txt
          arm-linux-gnueabi-nm -D -C "$SO" > audio-hal-analysis/reports/primary-dynamic-symbols.txt
          arm-linux-gnueabi-objdump -drwC "$SO" > audio-hal-analysis/reports/primary-disassembly.txt
          strings -a -n 4 -t x "$SO" > audio-hal-analysis/reports/primary-strings.txt

      - name: Extract focused function bodies and references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("audio-hal-analysis/reports/primary-disassembly.txt")
          text=p.read_text(errors="replace")
          names=[
            "AudioALSAStreamManager::setSpkFilterParam",
            "AudioALSAStreamManager::UpdateACFHCF",
            "AudioALSAHardware::SetACFPreviewParameter",
            "AudioALSAHardware::SetHCFPreviewParameter",
            "AudioMTKFilterManager::setSpkOutputGain",
            "AudioMTKFilterManager::process",
            "AudioMTKFilterManager::init",
            "AudioMTKFilter::setParameter",
            "AudioMTKFilter::setParameter2Sub",
            "AudioMTKFilter::setOutputGain",
            "AudioALSAStreamManager::setMasterVolume",
            "AudioALSAVolumeController::ApplyAudioGain",
          ]
          lines=text.splitlines()
          out=[]
          for name in names:
            hits=[i for i,line in enumerate(lines) if name in line and re.match(r"^[0-9a-f]+ <.*>:$",line.strip())]
            out.append("\\n===== "+name+" =====")
            if not hits:
              out.append("symbol label not found in disassembly")
              continue
            for i in hits:
              j=i+1
              while j<len(lines) and not re.match(r"^[0-9a-f]+ <.*>:$",lines[j].strip()):
                j+=1
              out.extend(lines[i:j])
          Path("audio-hal-analysis/reports/focused-functions.txt").write_text("\\n".join(out))
          PY
          grep -Ein 'ioctl|/dev/audiomux|audiomux|cd3313' audio-hal-analysis/reports/primary-disassembly.txt audio-hal-analysis/reports/primary-strings.txt > audio-hal-analysis/reports/cd3313-reference-search.txt || true
          grep -Ein 'ACF|HCF|CompensationFilter|streamoutacf|streamouthcf|AudioParam|audio_param' audio-hal-analysis/reports/primary-strings.txt > audio-hal-analysis/reports/filter-string-index.txt || true

      - name: Validate XML configurations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root=Path("audio-hal-analysis/input/files")
          out=[]
          for p in sorted(root.rglob("*.xml")):
            try:
              ET.parse(p)
              out.append(f"OK   {p.relative_to(root)}")
            except Exception as e:
              out.append(f"FAIL {p.relative_to(root)}: {e}")
          Path("audio-hal-analysis/reports/xml-validation.txt").write_text("\\n".join(out)+"\\n")
          PY

      - name: Upload reports
        uses: actions/upload-artifact@v5
        with:
          name: mt8163-audio-hal-analysis
          path: audio-hal-analysis/reports/
          if-no-files-found: error
          retention-days: 14
