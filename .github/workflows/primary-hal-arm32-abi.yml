name: Android 9 Primary HAL ARM32 ABI bootstrap

on:
  push:
    branches: [feature]
    paths:
      - "primary-hal/**"
      - "audio-core/**"
      - ".github/workflows/primary-hal-arm32-abi.yml"
  pull_request:
    paths:
      - "primary-hal/**"
      - "audio-core/**"
      - ".github/workflows/primary-hal-arm32-abi.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: primary-hal-arm32-abi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm32-abi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Android NDK r27c
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Fetch Android 9 platform headers
        run: |
          git clone --depth 1 --branch android-9.0.0_r3 \
            https://github.com/aosp-mirror/platform_hardware_libhardware.git build/libhardware
          git clone --depth 1 --branch android-9.0.0_r3 \
            https://github.com/aosp-mirror/platform_system_core.git build/system-core
          git clone --depth 1 --branch android-9.0.0_r3 \
            https://android.googlesource.com/platform/system/media build/system-media

      - name: Compile factory ABI bootstrap for ARM32
        run: |
          CLANG="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
          "$CLANG" \
            --target=armv7a-linux-androideabi28 \
            -std=c++17 \
            -Wall -Wextra -Wpedantic -Werror -Wno-c99-extensions \
            -fvisibility=hidden \
            -fno-exceptions -fno-rtti -fno-unwind-tables \
            -fno-asynchronous-unwind-tables \
            -fPIC -shared -nostdlib \
            -Wl,-soname,audio.primary.mt8163.so \
            -Ibuild/libhardware/include \
            -Ibuild/system-core/libcutils/include \
            -Ibuild/system-core/libsystem/include \
            -Ibuild/system-media/audio/include \
            primary-hal/src/primary_hal.cpp \
            -o build/audio.primary.mt8163.so
          READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          "$READELF" -h build/audio.primary.mt8163.so | grep -E "Class:.*ELF32|Machine:.*ARM"
          "$READELF" -d build/audio.primary.mt8163.so | grep -F "audio.primary.mt8163.so"
          "$READELF" -sW build/audio.primary.mt8163.so | grep -E "GLOBAL.*DEFAULT.*HMI$"

      - name: Cross-compile AudioCore for Android ARM32
        run: |
          set -euo pipefail
          CLANG="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
          LLVM_AR="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          mkdir -p build/audio-core-arm32/objects
          while IFS= read -r source; do
            object="build/audio-core-arm32/objects/$(basename "${source%.cpp}").o"
            "$CLANG" \
              --target=armv7a-linux-androideabi28 \
              -std=c++17 -O2 \
              -Wall -Wextra -Wpedantic -Werror \
              -fvisibility=hidden -fPIC \
              -Iaudio-core/include \
              -c "$source" -o "$object"
          done < <(find audio-core/src -maxdepth 1 -type f -name '*.cpp' | sort)
          "$LLVM_AR" rcs build/audio-core-arm32/libmt8163_audio_core.a build/audio-core-arm32/objects/*.o
          test -s build/audio-core-arm32/libmt8163_audio_core.a
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            -h build/audio-core-arm32/objects/primary_hal_stream_adapter.o | grep -E "Class:.*ELF32|Machine:.*ARM"
