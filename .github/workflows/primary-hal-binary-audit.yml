name: Primary HAL factory binary audit

on:
  push:
    branches: [main, feature]
    paths:
      - "tools/audit_primary_hal_binary.sh"
      - "tools/audit_android_packed_relocations.py"
      - ".github/workflows/primary-hal-binary-audit.yml"
  pull_request:
    paths:
      - "tools/audit_primary_hal_binary.sh"
      - ".github/workflows/primary-hal-binary-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: primary-hal-binary-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-factory-hal:
    name: Audit Android 9 factory primary HAL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audio engine
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/audit_primary_hal_binary.sh
            tools/audit_android_packed_relocations.py
          sparse-checkout-cone-mode: false

      - name: Checkout factory firmware artifact
        uses: actions/checkout@v4
        with:
          repository: 14vvp93/public_calculations
          ref: main
          path: factory-firmware
          sparse-checkout: |
            firmware/extracted/vendor/lib/hw/audio.primary.mt8163.so
            firmware/extracted/system/lib/
            firmware/extracted/vendor/lib/
            firmware/extracted/system/audio_policy_configuration.xml
            firmware/extracted/vendor/audio_policy_configuration.xml
            firmware/extracted/vendor/audio_policy.conf
            firmware/extracted/vendor/audio_device.xml
            firmware/extracted/vendor/audiocmdservice_atci
          sparse-checkout-cone-mode: false

      - name: Verify immutable factory artifact identity
        shell: bash
        run: |
          set -euo pipefail
          binary="factory-firmware/firmware/extracted/vendor/lib/hw/audio.primary.mt8163.so"
          test -s "$binary"
          actual_size="$(wc -c < "$binary" | tr -d ' ')"
          actual_sha="$(sha256sum "$binary" | awk '{print $1}')"
          expected_size="1671852"
          expected_sha="112744a4dad30d809d638d8aecd75ddba1ed7bbfcda8c4d2f9fde4463d8bfde4"
          printf 'Artifact size: %s\nArtifact SHA-256: %s\n' "$actual_size" "$actual_sha"
          test "$actual_size" = "$expected_size"
          test "$actual_sha" = "$expected_sha"

      - name: Install ARM32 disassembler
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils-arm-linux-gnueabi

      - name: Audit ELF and exported HAL module symbol
        shell: bash
        run: |
          set -euo pipefail
          binary="factory-firmware/firmware/extracted/vendor/lib/hw/audio.primary.mt8163.so"
          {
            sh tools/audit_primary_hal_binary.sh "$binary"
            python3 tools/audit_android_packed_relocations.py "$binary"
            python3 tools/audit_android_packed_relocations.py "$binary" --symbol _ZTVN7android18AudioALSAStreamOutE
            python3 tools/audit_android_packed_relocations.py "$binary" --symbol _ZTVN7android17AudioALSAStreamInE
          } 2>&1 | tee primary-hal-audit-report.txt

      - name: Disassemble factory stream negotiation methods
        shell: bash
        run: |
          set -euo pipefail
          binary="factory-firmware/firmware/extracted/vendor/lib/hw/audio.primary.mt8163.so"
          objdump=arm-linux-gnueabi-objdump
          {
            echo "===== Factory stream negotiation symbol inventory ====="
            arm-linux-gnueabi-nm -D -C --defined-only "$binary" |
              grep -E 'AudioALSAStream(Out|In)::(set\(|open\(|checkOpenStream)' || true

            echo
            echo "===== AudioALSAStreamOut::set ====="
            "$objdump" -d -C --start-address=0x8172c --stop-address=0x81c8c "$binary"

            echo
            echo "===== AudioALSAStreamOut::open ====="
            "$objdump" -d -C --start-address=0x83d54 --stop-address=0x8405c "$binary"

            echo
            echo "===== AudioALSAStreamIn::set ====="
            "$objdump" -d -C --start-address=0x128318 --stop-address=0x128838 "$binary"

            echo
            echo "===== AudioALSAStreamIn::open ====="
            "$objdump" -d -C --start-address=0x12b510 --stop-address=0x12b718 "$binary"

            echo
            echo "===== AudioALSAStreamOut/Input getters ====="
            "$objdump" -d -C --start-address=0x81d48 --stop-address=0x81d58 "$binary"
            "$objdump" -d -C --start-address=0x81d50 --stop-address=0x81d58 "$binary"
            "$objdump" -d -C --start-address=0x81db0 --stop-address=0x81db8 "$binary"

            echo
            echo "===== AudioALSAStreamOut::SampleRateSupport ====="
            "$objdump" -d -C --start-address=0x81c8c --stop-address=0x81d48 "$binary"

            echo
            echo "===== AudioALSAStreamOut::bufferSizeTimeUs ====="
            "$objdump" -d -C --start-address=0x81d58 --stop-address=0x81db0 "$binary"

            echo
            echo "===== AudioALSAStreamIn::checkOpenStreamFormat ====="
            "$objdump" -d -C --start-address=0x127fac --stop-address=0x12800c "$binary"

            echo
            echo "===== AudioALSAStreamIn::checkOpenStreamChannels ====="
            "$objdump" -d -C --start-address=0x12800c --stop-address=0x128094 "$binary"

            echo
            echo "===== AudioALSAStreamIn::checkOpenStreamSampleRate ====="
            "$objdump" -d -C --start-address=0x128094 --stop-address=0x128318 "$binary"
          } 2>&1 | tee primary-hal-stream-methods.txt

      - name: Disassemble MediaTek primary-device HAL client bridge
        shell: bash
        run: |
          set -euo pipefail
          client="factory-firmware/firmware/extracted/vendor/lib/libaudioprimarydevicehalifclient.so"
          test -s "$client"
          {
            echo "===== MTKPrimaryDevicesHalClientImpl dynamic symbols ====="
            arm-linux-gnueabi-nm -D -C --defined-only "$client" |
              grep -E 'MTKPrimaryDevicesHalClientImpl::(MTKPrimaryDevicesHalClientImpl|setParameters|getParameters|~MTKPrimaryDevicesHalClientImpl)' || true
            echo
            echo "===== MTKPrimaryDevicesHalClient::getInstance ====="
            arm-linux-gnueabi-objdump -d -C --start-address=0x3cc8 --stop-address=0x3e74 "$client"
            echo
            echo "===== MTKPrimaryDevicesHalClientImpl constructor ====="
            arm-linux-gnueabi-objdump -d -C --start-address=0x3e74 --stop-address=0x4008 "$client"
            echo
            echo "===== MTKPrimaryDevicesHalClientImpl::setParameters ====="
            arm-linux-gnueabi-objdump -d -C --start-address=0x40cc --stop-address=0x4170 "$client"
            echo
            echo "===== MTKPrimaryDevicesHalClientImpl::getParameters ====="
            arm-linux-gnueabi-objdump -d -C --start-address=0x4170 --stop-address=0x4210 "$client"
          } 2>&1 | tee primary-hal-client-bridge.txt

      - name: Disassemble MediaTek HIDL 4.1 bridge to legacy Primary HAL callbacks
        shell: bash
        run: |
          set -euo pipefail
          bridge="factory-firmware/firmware/extracted/vendor/lib/hw/android.hardware.audio@4.0-impl-mediatek.so"
          interface="factory-firmware/firmware/extracted/vendor/lib/vendor.mediatek.hardware.audio@4.1.so"
          test -s "$bridge"
          test -s "$interface"
          {
            echo "===== HIDL implementation binary identity ====="
            sha256sum "$bridge" "$interface"
            echo
            echo "===== HIDL implementation methods ====="
            arm-linux-gnueabi-nm -D -C --defined-only "$bridge" |
              grep -E 'implementation::MTKPrimaryDevice::(setupParametersCallback|getVoiceUnlockULTime|setVoiceUnlockSRC|startVoiceUnlockDL|stopVoiceUnlockDL|getVoiceUnlockDLInstance|setAudioParameterChangedCallback|clearAudioParameterChangedCallback)|implementation::Device::(setupParametersCallback|getVoiceUnlockULTime|setVoiceUnlockSRC|startVoiceUnlockDL|stopVoiceUnlockDL|getVoiceUnlockDLInstance|audioParameterChangedCallback|setAudioParameterChangedCallback|clearAudioParameterChangedCallback)' || true
            echo
            echo "===== Device::setupParametersCallback ====="
            arm-linux-gnueabi-objdump -d -C --start-address=0x1cadc --stop-address=0x1cc74 "$bridge"
            echo
            echo "===== Device parameter callback registration and teardown ====="
            arm-linux-gnueabi-objdump -d -C --start-address=0x1cc74 --stop-address=0x1ce00 "$bridge"
            echo
            echo "===== Device voice unlock methods ====="
            arm-linux-gnueabi-objdump -d -C --start-address=0x1d72c --stop-address=0x1d8c0 "$bridge"
            echo
            echo "===== MTKPrimaryDevice HIDL method forwarding ====="
            arm-linux-gnueabi-objdump -d -C --start-address=0x2633c --stop-address=0x26450 "$bridge"
            echo
            echo "===== HIDL interface method inventory ====="
            arm-linux-gnueabi-nm -D -C --defined-only "$interface" |
              grep -E 'BpHwMTKPrimaryDevice::(setupParametersCallback|getVoiceUnlockULTime|setVoiceUnlockSRC|startVoiceUnlockDL|stopVoiceUnlockDL|getVoiceUnlockDLInstance|setAudioParameterChangedCallback|clearAudioParameterChangedCallback)|IAudioParameterChangedCallback::audioParameterChangedCallback' || true
          } 2>&1 | tee primary-hal-hidl-bridge.txt

      - name: Scan all extracted system and vendor shared libraries for private HAL callback references
        shell: bash
        run: |
          set -euo pipefail
          root="factory-firmware/firmware/extracted"
          report="primary-hal-private-client-scan.txt"
          patterns='xWayPlay|xWayRec|VoiceUnlock|voice.?unlock|ReadRefFromRing|setupParametersCallback|audioParameterChanged|setAudioParameterChangedCallback|clearAudioParameterChangedCallback|MTKPrimaryDevicesHalClient|AudioALSAHardware'
          : > "$report"
          scanned=0
          matched=0
          while IFS= read -r -d '' file; do
            scanned=$((scanned + 1))
            symbols="$(arm-linux-gnueabi-nm -D -C "$file" 2>/dev/null | grep -Ei "$patterns" || true)"
            strings_found="$(strings -a "$file" 2>/dev/null | grep -Ei "$patterns" | sort -u || true)"
            if [ -n "$symbols" ] || [ -n "$strings_found" ]; then
              matched=$((matched + 1))
              {
                echo
                echo "===== ${file#"$root/"} ====="
                sha256sum "$file"
                if [ -n "$symbols" ]; then
                  echo "-- dynamic symbol matches --"
                  printf '%s\\n' "$symbols"
                fi
                if [ -n "$strings_found" ]; then
                  echo "-- printable string matches --"
                  printf '%s\\n' "$strings_found"
                fi
              } >> "$report"
            fi
          done < <(find "$root/system/lib" "$root/vendor/lib" -type f -name '*.so' -print0 | sort -z)
          {
            echo "Scanned shared libraries: $scanned"
            echo "Libraries with matching symbols or strings: $matched"
            echo
            echo "This is a bounded symbol/string scan. It does not prove absence of indirect calls through private structure offsets."
            echo
            echo "===== Linker namespace and policy configuration presence ====="
            for file in \
              "$root/system/etc/ld.config.txt" \
              "$root/system/etc/ld.config.28.txt" \
              "$root/vendor/etc/ld.config.txt" \
              "$root/vendor/etc/ld.config.28.txt" \
              "$root/system/audio_policy_configuration.xml" \
              "$root/vendor/audio_policy_configuration.xml" \
              "$root/vendor/audio_policy.conf" \
              "$root/vendor/audio_device.xml"; do
              if [ -s "$file" ]; then
                echo "PRESENT: ${file#"$root/"}"
                sha256sum "$file"
              else
                echo "ABSENT: ${file#"$root/"}"
              fi
            done
          } >> "$report"
          cat "$report"

      - name: Preserve audited factory binary and report as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mt8163-factory-primary-hal-audit
          path: |
            factory-firmware/firmware/extracted/vendor/lib/hw/audio.primary.mt8163.so
            primary-hal-audit-report.txt
            primary-hal-stream-methods.txt
            primary-hal-private-client-scan.txt
            primary-hal-client-bridge.txt
            primary-hal-hidl-bridge.txt
          if-no-files-found: error
          retention-days: 7
