name: Android ARMv7 cross-build

on:
  push:
    branches: [main, feature]
    paths:
      - "pcm-dsp/**"
      - "audio-core/**"
  pull_request:
    branches: [main, feature]
    paths:
      - "pcm-dsp/**"
      - "audio-core/**"
  workflow_dispatch:

concurrency:
  group: android-armv7-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  android-armv7:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Use preinstalled Android NDK r27d (install only if missing)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_NDK_VERSION: 27.3.13750724
        run: |
          set -euo pipefail
          NDK_DIR="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          if [ ! -x "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
            test -n "$SDKMANAGER"
            yes | "$SDKMANAGER" --licenses >/dev/null
            "$SDKMANAGER" --install "ndk;$ANDROID_NDK_VERSION"
          fi
          test -x "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Configure Android ARMv7
        run: >
          cmake -S pcm-dsp -B build/android-armv7
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=armeabi-v7a
          -DANDROID_PLATFORM=android-28
          -DANDROID_STL=c++_static
          -DPCM_DSP_BUILD_TESTS=OFF
          -DPCM_DSP_BUILD_BENCHMARKS=OFF
          -DPCM_DSP_BUILD_ANDROID_JNI=ON
          -DCMAKE_BUILD_TYPE=Release
      - name: Build Android ARMv7 static library
        run: cmake --build build/android-armv7 --parallel
      - name: Verify ARM ELF architecture
        run: |
          mkdir -p build/android-armv7/verify
          cd build/android-armv7/verify
          ar x ../libmt8163_pcm_dsp.a
          readelf -h quad_engine.cpp.o | grep -E "Class:|Machine:"
          readelf -h ../libmt8163_audio_jni.so | grep -E "Class:|Machine:"
          mkdir -p audio-core
          cd audio-core
          ar x ../../audio-core-build/libmt8163_audio_core.a
          readelf -h mute_arbiter.cpp.o | grep -E "Class:|Machine:"
          readelf -h cd3313_compat.cpp.o | grep -E "Class:|Machine:"
          readelf -h session_registry.cpp.o | grep -E "Class:|Machine:"
          readelf -h snapshot_publisher_compile_check.cpp.o | grep -E "Class:|Machine:"
      - name: Upload Android ARMv7 libraries
        uses: actions/upload-artifact@v6
        with:
          name: mt8163-audio-engine-android-armv7
          path: |
            build/android-armv7/libmt8163_pcm_dsp.a
            build/android-armv7/audio-core-build/libmt8163_audio_core.a
            build/android-armv7/libmt8163_audio_jni.so
          if-no-files-found: error
          retention-days: 30
