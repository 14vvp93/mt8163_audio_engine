name: Repository integrity

on:
  push:
    branches: [main, feature]
    paths:
      - "**/*.md"
      - "README.md"
      - "scripts/repository/check_markdown_links.py"
      - "scripts/device/**"
      - "tools/audit_primary_hal_binary.sh"
      - "tools/audit_android_packed_relocations.py"
      - ".github/workflows/**"
  pull_request:
    branches: [main, feature]
    paths:
      - "**/*.md"
      - "README.md"
      - "scripts/repository/check_markdown_links.py"
      - "scripts/device/**"
      - "tools/audit_primary_hal_binary.sh"
      - "tools/audit_android_packed_relocations.py"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read


jobs:
  markdown-links:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Markdown files only
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /.github/workflows/**
            /*.md
            **/*.md
            /scripts/repository/check_markdown_links.py
            /scripts/device/collect_mt8163_audio_runtime.sh
            /tools/audit_primary_hal_binary.sh
            /tools/audit_android_packed_relocations.py
          sparse-checkout-cone-mode: false
      - name: Validate workflow YAML structure
        run: |
          ruby -e 'require "yaml"; Dir.glob(".github/workflows/*.{yml,yaml}").sort.each { |file| data = YAML.load_file(file); abort("Invalid workflow structure: #{file}") unless data.is_a?(Hash) && data["name"] && data["jobs"].is_a?(Hash); puts "YAML OK: #{file}" }'
      - name: Validate local Markdown links
        run: python3 scripts/repository/check_markdown_links.py
      - name: Validate read-only device collector syntax
        run: bash -n scripts/device/collect_mt8163_audio_runtime.sh
      - name: Validate primary HAL audit script syntax
        run: sh -n tools/audit_primary_hal_binary.sh
      - name: Validate APS2 relocation audit script syntax
        run: python3 -m py_compile tools/audit_android_packed_relocations.py
