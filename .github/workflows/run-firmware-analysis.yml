name: Run firmware analysis on public compute

on:
  workflow_dispatch:
    inputs:
      analysis:
        description: Firmware analysis workload
        required: true
        type: choice
        options:
          - audio-hal
          - cd3313-ioctl
          - cd3313-static
          - firmware-images
          - firmware-libraries
          - firmware-integrity
          - heq-decompile
          - audio-config-audit
          - audiomux-client-scan

permissions:
  contents: read

jobs:
  audio-hal:
    if: inputs.analysis == 'audio-hal'
    uses: 14vvp93/public_calculations/.github/workflows/worker-analyze-audio-hal.yml@main

  cd3313-ioctl:
    if: inputs.analysis == 'cd3313-ioctl'
    uses: 14vvp93/public_calculations/.github/workflows/worker-analyze-cd3313-ioctl.yml@main

  cd3313-static:
    if: inputs.analysis == 'cd3313-static'
    uses: 14vvp93/public_calculations/.github/workflows/worker-analyze-cd3313.yml@main

  firmware-images:
    if: inputs.analysis == 'firmware-images'
    uses: 14vvp93/public_calculations/.github/workflows/worker-analyze-firmware-images.yml@main

  firmware-libraries:
    if: inputs.analysis == 'firmware-libraries'
    uses: 14vvp93/public_calculations/.github/workflows/worker-analyze-firmware-libraries.yml@main

  firmware-integrity:
    if: inputs.analysis == 'firmware-integrity'
    uses: 14vvp93/public_calculations/.github/workflows/worker-audit-firmware-integrity.yml@main

  heq-decompile:
    if: inputs.analysis == 'heq-decompile'
    uses: 14vvp93/public_calculations/.github/workflows/worker-decompile-heq.yml@main

  audio-config-audit:
    if: inputs.analysis == 'audio-config-audit'
    uses: 14vvp93/public_calculations/.github/workflows/worker-firmware-audio-config-audit.yml@main

  audiomux-client-scan:
    if: inputs.analysis == 'audiomux-client-scan'
    uses: 14vvp93/public_calculations/.github/workflows/worker-scan-audiomux-clients.yml@main
