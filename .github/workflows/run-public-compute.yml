name: Run public firmware compute

on:
  workflow_dispatch:
    inputs:
      task:
        description: Heavy task to run against public MT8163 firmware
        required: true
        type: choice
        options:
          - inventory
          - verify
          - all-light
          - audio-inventory
      retention_days:
        description: Result artifact retention (1-90 days)
        required: true
        default: "14"
        type: string

permissions:
  contents: read

jobs:
  public-compute:
    name: Execute on public compute worker
    uses: 14vvp93/public_calculations/.github/workflows/compute.yml@main
    with:
      task: ${{ inputs.task }}
      retention_days: ${{ inputs.retention_days }}
