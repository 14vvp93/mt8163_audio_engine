name: Run public firmware compute

on:
  workflow_dispatch:
    inputs:
      task:
        description: Heavy task to run in public_calculations
        required: true
        type: choice
        options:
          - inventory
          - extract
          - all-light
          - audio-inventory
      archive_directory:
        description: Archive directory in public_calculations
        required: false
        default: firmware/archives/mt8163
        type: string
      retention_days:
        description: Result artifact retention (1-30 days)
        required: true
        default: "14"
        type: string

permissions:
  contents: read

jobs:
  public-compute:
    name: Execute on public compute worker
    uses: 14vvp93/public_calculations/.github/workflows/compute.yml@main
    with:
      task: ${{ inputs.task }}
      archive_directory: ${{ inputs.archive_directory }}
      retention_days: ${{ inputs.retention_days }}
