name: Analyze CD3313 kernel module

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/analyze-cd3313.yml"
      - "cd3313.ko"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils binutils-arm-linux-gnueabi binutils-multiarch file python3

      - name: Validate module
        run: |
          test -s cd3313.ko
          file cd3313.ko | tee module-file.txt
          sha256sum cd3313.ko | tee module-sha256.txt

      - name: Generate static analysis reports
        run: |
          mkdir -p cd3313-analysis
          cp module-file.txt module-sha256.txt cd3313-analysis/
          set +e
          run_report() {
            name="$1"
            shift
            "$@" > "cd3313-analysis/$name" 2>&1
            code=$?
            printf '%s\texit=%s\n' "$name" "$code" >> cd3313-analysis/command-status.txt
          }
          run_report elf-header.txt readelf -h cd3313.ko
          run_report sections.txt readelf -S cd3313.ko
          run_report symbols-readelf.txt readelf -sW cd3313.ko
          run_report relocations.txt readelf -rW cd3313.ko
          run_report dwarf-info.txt readelf --debug-dump=info cd3313.ko
          run_report dwarf-lines.txt readelf --debug-dump=decodedline cd3313.ko
          run_report disassembly-lines.txt objdump -m arm -dlwC cd3313.ko
          run_report address-to-source.txt addr2line -e cd3313.ko -f -i 0x11ec 0x1200 0x1288 0x139c 0x14ac 0x14f0 0x1538 0x15fc 0x163c 0x1694 0x1788 0x1818 0x1858 0x188c
          run_report symbols-nm.txt nm -an cd3313.ko
          run_report strings.txt strings -a -n 4 -t x cd3313.ko
          run_report disassembly-relocations.txt objdump -m arm -drwC cd3313.ko
          run_report section-bytes.txt arm-linux-gnueabi-objdump -s cd3313.ko
          true
          {
            echo "# CD3313 module analysis"
            echo
            echo "Generated from repository file cd3313.ko."
            echo
            echo '## Module identity'
            cat module-file.txt
            cat module-sha256.txt
            echo
            echo '## Report files'
            find cd3313-analysis -maxdepth 1 -type f -printf '%f\n' | sort
          } > cd3313-analysis/README.md

      - name: Upload analysis reports
        uses: actions/upload-artifact@v5
        with:
          name: cd3313-static-analysis
          path: cd3313-analysis/
          if-no-files-found: error
          retention-days: 14
