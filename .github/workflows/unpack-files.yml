name: Extract reference-materials/firmware-dumps/files.zip

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/unpack-files.yml"
      - "reference-materials/firmware-dumps/files.zip"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify archive
        run: |
          test -f reference-materials/firmware-dumps/files.zip || { echo "::error::reference-materials/firmware-dumps/files.zip was not found in the repository root"; exit 1; }
          unzip -t reference-materials/firmware-dumps/files.zip

      - name: Extract archive safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          archive = Path("reference-materials/firmware-dumps/files.zip")
          destination = Path("extracted-files").resolve()
          destination.mkdir(parents=True, exist_ok=True)

          with ZipFile(archive) as zf:
              for item in zf.infolist():
                  target = (destination / item.filename).resolve()
                  if target != destination and destination not in target.parents:
                      raise SystemExit(f"Unsafe archive path: {item.filename}")
                  if item.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with zf.open(item) as source, target.open("wb") as output:
                          output.write(source.read())

          files = [p for p in destination.rglob("*") if p.is_file()]
          print(f"Extracted {len(files)} files")
          for path in sorted(files):
              print(f"{path.relative_to(destination)}\t{path.stat().st_size} bytes")
          PY

      - name: Inventory kernel modules and event-queue symbols
        run: |
          mkdir -p extracted-files/_analysis
          report="extracted-files/_analysis/module-symbol-inventory.txt"
          : > "$report"
          while IFS= read -r -d '' module; do
            {
              echo "### $module"
              file "$module"
              strings -a "$module" | grep -Ei 'handler_thread|post_event_delayed|remove_event|handler_create|audiomux|cd3313' || true
              echo
            } >> "$report"
          done < <(find extracted-files -type f -name '*.ko' -print0)
          cat "$report"

      - name: Upload extracted files
        uses: actions/upload-artifact@v6
        with:
          name: extracted-files
          path: extracted-files/
          if-no-files-found: error
          retention-days: 7
