name: Inspect files2 split archive

on:
  push:
    paths:
      - '.github/workflows/inspect-files2.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install archive tools
        run: sudo apt-get update && sudo apt-get install -y p7zip-full
      - name: Join and validate split archive
        run: |
          set -euo pipefail
          test -s files2.zip.001
          test -s files2.zip.002
          test -s files2.zip.003
          cat files2.zip.001 files2.zip.002 files2.zip.003 > /tmp/files2.zip
          7z t /tmp/files2.zip
      - name: Extract archive and create inventory
        run: |
          set -euo pipefail
          mkdir -p /tmp/files2
          7z x /tmp/files2.zip -o/tmp/files2 -y
          find /tmp/files2 -type f -printf '%P\t%s bytes\n' | sort > /tmp/files2-inventory.txt
          du -sh /tmp/files2
          sed -n '1,250p' /tmp/files2-inventory.txt
      - name: Upload extracted archive and inventory
        uses: actions/upload-artifact@v4
        with:
          name: files2-extracted-and-inventory
          path: |
            /tmp/files2
            /tmp/files2-inventory.txt
          if-no-files-found: error
          retention-days: 7
