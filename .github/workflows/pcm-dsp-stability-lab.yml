name: PCM DSP Stability Lab

on:
  workflow_dispatch:


jobs:
  stability-lab:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S pcm-dsp -B build -DCMAKE_BUILD_TYPE=Release -DPCM_DSP_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Run standard and stability tests
        run: ctest --test-dir build --output-on-failure
