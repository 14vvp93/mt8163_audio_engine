name: PCM DSP Performance Benchmark

on:
  workflow_dispatch:


jobs:
  host-benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Configure release benchmark
        run: cmake -S pcm-dsp -B build -DCMAKE_BUILD_TYPE=Release -DPCM_DSP_BUILD_TESTS=OFF -DPCM_DSP_BUILD_BENCHMARKS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Run benchmark
        run: ./build/pcm_dsp_benchmark | tee pcm-dsp-host-benchmark.txt
      - name: Upload benchmark report
        uses: actions/upload-artifact@v6
        with:
          name: pcm-dsp-host-benchmark
          path: pcm-dsp-host-benchmark.txt
          retention-days: 30
