name: Scan vendor archive for CD3313 userspace clients

on:
  workflow_dispatch:
  push:
    branches: [main, feature/cd3313-driver-rewrite]
    paths:
      - "reference-materials/extracted/**"
      - ".github/workflows/scan-audiomux-clients.yml"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip binutils file ripgrep python3

      - name: Extract archive and inventory files
        run: |
          test -d reference-materials/extracted
          mkdir -p audiomux-client-scan/input audiomux-client-scan/reports
          cp -a reference-materials/extracted/. audiomux-client-scan/input/
          find audiomux-client-scan/input -type f -print0 | sort -z |
            xargs -0 file > audiomux-client-scan/reports/file-inventory.txt

      - name: Scan text and binary strings for device and ioctl references
        run: |
          set +e
          ROOT=audiomux-client-scan/input
          OUT=audiomux-client-scan/reports
          rg -a -n -i -C 2 'audiomux|cd3313|dsp_i2c_driver|STATUS_WRITE_CMD|STATUS_READ_CMD|ioctl[[:space:]]*\(' "$ROOT" > "$OUT/text-and-source-matches.txt"
          : > "$OUT/binary-string-matches.txt"
          while IFS= read -r -d '' f; do
            strings -a -n 4 "$f" 2>/dev/null |
              grep -Ein -C 2 'audiomux|cd3313|dsp_i2c_driver|STATUS_WRITE_CMD|STATUS_READ_CMD|ioctl|0x15|0xF0' |
              sed "s#^#${f}:#" >> "$OUT/binary-string-matches.txt"
          done < <(find "$ROOT" -type f -print0)
          grep -Ein 'audio|bluetooth|service|atci|vendor|.so|.apk' "$OUT/file-inventory.txt" > "$OUT/audio-related-files.txt" || true
          true

      - name: Upload scan reports
        uses: actions/upload-artifact@v6
        with:
          name: audiomux-userspace-client-scan
          path: audiomux-client-scan/reports/
          if-no-files-found: error
          retention-days: 14
